<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공급처 화면 — BMCTVda 보성 직거래장터</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">

<div id="loginView">
  <div class="panel login-box">
    <h2>공급처 로그인</h2>
    <p class="muted">위탁판매 계약을 체결한 공급처만 이용하실 수 있습니다.</p>
    <div class="field"><label>아이디</label><input id="loginId" autocomplete="username"></div>
    <div class="field"><label>비밀번호</label><input id="loginPw" type="password" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">로그인</button>
    <div id="loginMsg"></div>
    <p class="mini" style="margin-top:14px">아이디·비밀번호는 운영자(히스메이커스)가 발급합니다. 문의 010-6704-9810</p>
    <p class="mini"><a href="/">← 쇼핑몰로 돌아가기</a></p>
  </div>
</div>

<div id="appView" class="hidden">
  <div class="admin-top">
    <div class="title">BMCTVda 공급처 화면 — <span id="supplierName"></span></div>
    <div>
      <a class="btn btn-sm btn-ghost" href="/">쇼핑몰</a>
      <button class="btn btn-sm btn-ghost" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <nav class="admin-nav">
    <button data-view="products" class="active">내 상품</button>
    <button data-view="new">상품 등록</button>
    <button data-view="orders">주문 · 발송</button>
    <button data-view="sales">판매 현황 · 정산</button>
    <button data-view="account">계약 · 내 정보</button>
  </nav>
  <div class="admin-wrap">
    <section id="view-products"></section>
    <section id="view-new" class="hidden"></section>
    <section id="view-orders" class="hidden"></section>
    <section id="view-sales" class="hidden"></section>
    <section id="view-account" class="hidden"></section>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg-head"><b id="dlgTitle"></b><button class="btn btn-sm btn-ghost" onclick="dlg.close()">닫기</button></div>
  <div class="dlg-body" id="dlgBody"></div>
  <div class="dlg-foot" id="dlgFoot"></div>
</dialog>

<script src="/js/supplier.js"></script>
</body>
</html>
