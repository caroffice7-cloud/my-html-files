<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운영자 화면 — BMCTVda 보성 직거래장터</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">

<div id="loginView">
  <div class="panel login-box">
    <h2>운영자 로그인</h2>
    <p class="muted">농업회사법인 히스메이커스 주식회사 · 자사몰 통합 관리</p>
    <div class="field"><label>관리자 비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">로그인</button>
    <div id="loginMsg"></div>
    <p class="mini" style="margin-top:14px">비밀번호는 환경변수 <code>ADMIN_PASSWORD</code> 로 지정합니다. (기본값 bmctvda2026)</p>
    <p class="mini"><a href="/">← 쇼핑몰로 돌아가기</a></p>
  </div>
</div>

<div id="appView" class="hidden">
  <div class="admin-top">
    <div class="title">BMCTVda 자사몰 통합 관리</div>
    <div>
      <a class="btn btn-sm btn-ghost" href="/">쇼핑몰</a>
      <button class="btn btn-sm btn-ghost" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <nav class="admin-nav">
    <button data-view="dashboard" class="active">대시보드</button>
    <button data-view="products">상품 승인 · 관리</button>
    <button data-view="channels">채널 연동</button>
    <button data-view="orders">주문 관리</button>
    <button data-view="suppliers">공급처 · 계약</button>
    <button data-view="commissions">수수료 관리</button>
    <button data-view="settlement">정산</button>
    <button data-view="settings">설정</button>
  </nav>
  <div class="admin-wrap">
    <section id="view-dashboard"></section>
    <section id="view-products" class="hidden"></section>
    <section id="view-channels" class="hidden"></section>
    <section id="view-orders" class="hidden"></section>
    <section id="view-suppliers" class="hidden"></section>
    <section id="view-commissions" class="hidden"></section>
    <section id="view-settlement" class="hidden"></section>
    <section id="view-settings" class="hidden"></section>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg-head"><b id="dlgTitle"></b><button class="btn btn-sm btn-ghost" onclick="dlg.close()">닫기</button></div>
  <div class="dlg-body" id="dlgBody"></div>
  <div class="dlg-foot" id="dlgFoot"></div>
</dialog>

<script src="/js/admin.js"></script>
</body>
</html>
